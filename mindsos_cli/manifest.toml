# mindsos canonical truth file — single source of pinned versions and digests.
#
# All other files (Dockerfile, docker-compose.yml, requirements.txt) are checked
# AGAINST this file by `mindsos doctor --self-test`. Drift exits non-zero.
#
# When updating a pinned version: edit this file FIRST, then update the consumers
# (Dockerfile FROM lines, docker-compose.yml image refs, requirements.txt).
# `tools/lock.sh` regenerates requirements.txt and prints the new sha256 to paste
# below.
#
# This file is hand-maintained. Do not auto-generate from Dockerfile/compose —
# that would defeat the drift-detection purpose.

[mindsos]
phase = "34"
version = "0.0.0+phase34"
# Phase 27 generalization (PB-25/33): authoritative top-level package
# list for the doctor parity loop. Each new-top-level-pkg phase appends
# here; doctor.py + tests/phase_18/test_doctor_6pkg_parity.py iterate
# this list instead of hard-coding tuples — closes the literal-decay
# class.
packages = [
    "mindsos_cli",
    "mindsos_core",
    "mindsos_instances",
    "mindsos_knowledge",
    "mindsos_admin",
    "mindsos_server",
    "mindsos_capacity",
]

[runtime.falkordb]
image = "falkordb/falkordb"
tag = "v4.18.3"
digest = "sha256:30c530c193ac48cb6ea8c6cae745f793d2c098a0a138f7b3e46c1d90848845ba"
version = "4.18.3"

# Phase 07 — [falkordb] section consumed by FalkorConfig.from_manifest()
# (P5 → P15 A hybrid env + manifest). Password env-only (P15 A).
# No `username` field per P86 B (FalkorDB-Redis auth has no username).
[falkordb]
host = "localhost"
port = 6379
graph = "mindsos"

# Phase 18 — `server.db` location per PB-17 manifest-fallback chain
# (env MINDSOS_SERVER_DB > this field > hard-coded ~/.mindsos/server.db).
# Empty string means "no manifest override; fall back to default".
# Phase 18 ships with empty string — local installs use the default;
# operators set this in deploy configs.
[server]
db_path = ""

[runtime.python]
image = "python"
tag = "3.12.3-slim-bookworm"
digest = "sha256:afc139a0a640942491ec481ad8dda10f2c5b753f5c969393b12480155fe15a63"
version = "3.12.3"

[lockfile]
# sha256 of requirements.txt — populated by tools/lock.sh after pip-compile.
# Until tools/lock.sh has been run on the tester's box, this is "PENDING_LOCK"
# so `mindsos doctor --self-test` reports a clear diagnostic instead of a hex
# mismatch. Phase 01 does NOT change requirements.in (only requirements-test.in
# adds pytest-json-report), so this hash is unchanged from Phase 00.
requirements_txt_sha256 = "aa00945fc9f67868393be85843e17fb3947e28c0ed4445900c51a1244bc445d7"

[ci]
# Workflow files that `doctor --self-test` verifies exist + non-empty + parse-shaped.
# Added in Phase 01; checked from Phase 01 onward. Earlier-phase checkouts will
# fail this assertion — that's intentional, you only run self-test on the
# current-phase branch.
required_workflows = [
    ".github/workflows/phase-ci.yml",
    ".github/workflows/release.yml",
]
# mkdocs is installed ad-hoc in CI (NOT in the test image — keeps the image
# slim). `doctor --self-test` does not check mkdocs presence on the host.
mkdocs_version = "1.6.1"
