<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC-AGI-1 Viewer</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --border:#2b3440;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#f778ba;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  header h1 .v{color:var(--accent2)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--muted);border:0;padding:6px 12px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--accent);color:#06121f;font-weight:600}
  .ctrl{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .ctrl input[type=range]{width:110px}
  button.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px}
  button.btn:hover{border-color:var(--accent)}
  label.chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none}
  .spacer{flex:1}
  main{display:flex;flex:1;min-height:0}
  aside{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  aside .search{padding:10px}
  aside .search input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:7px;padding:7px 9px;font-size:13px}
  .count{padding:0 12px 8px;color:var(--muted);font-size:12px}
  .list{overflow:auto;flex:1;padding:0 6px 12px}
  .list .row{padding:6px 10px;border-radius:6px;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
  .list .row:hover{background:var(--panel2)}
  .list .row.on{background:var(--accent);color:#06121f;font-weight:600}
  .list .row .ix{opacity:.6}
  section.view{flex:1;overflow:auto;padding:18px 22px}
  .taskhead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .taskhead .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;color:var(--accent)}
  .taskhead .meta{color:var(--muted);font-size:12.5px}
  .group-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
  .pairs{display:flex;flex-wrap:wrap;gap:18px}
  .pair{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .pair .lbl{color:var(--muted);font-size:11.5px;margin-bottom:8px}
  .io{display:flex;align-items:center;gap:12px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cell .dim{color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
  .arrow{color:var(--muted);font-size:20px}
  canvas{image-rendering:pixelated;background:#000;border-radius:4px}
  .hidden-out{display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px dashed var(--border);border-radius:4px;font-size:12px;padding:0 10px}
  .palette{display:flex;gap:3px;align-items:center;color:var(--muted);font-size:11px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<header>
  <h1>ARC&#8209;AGI&#8209;<span class="v">1</span> Viewer</h1>
  <div class="seg" id="split">
    <button data-s="train" class="on">Training</button>
    <button data-s="eval">Evaluation</button>
  </div>
  <button class="btn" id="prev">&larr; Prev</button>
  <button class="btn" id="next">Next &rarr;</button>
  <button class="btn" id="rand">Random</button>
  <div class="ctrl">Cell <input id="cs" type="range" min="6" max="34" value="18"></div>
  <label class="chk"><input type="checkbox" id="grid" checked> grid</label>
  <label class="chk"><input type="checkbox" id="showout" checked> test output</label>
  <div class="spacer"></div>
  <div class="palette" id="palette"></div>
</header>
<main>
  <aside>
    <div class="search"><input id="filter" placeholder="filter task id…" autocomplete="off"></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="view" id="view"></section>
</main>

<script src="arc1_data.js"></script>
<script>
const PAL = ["#000000","#0074D9","#FF4136","#2ECC40","#FFDC00","#AAAAAA","#F012BE","#FF851B","#7FDBFF","#870C25"];
const state = { split:"train", id:null, cs:18, grid:true, showout:true, filter:"" };
const D = window.ARC1;

// Canonical ARC order = task IDs sorted ascending (how the official dataset's
// per-task files list). Sorting also avoids JS hoisting all-digit keys to the front.
const _idCache={};
function ids(){ return _idCache[state.split] || (_idCache[state.split]=Object.keys(D[state.split]).sort()); }

function drawGrid(g){
  const rows=g.length, cols=g[0].length, cs=state.cs;
  const c=document.createElement("canvas");
  c.width=cols*cs; c.height=rows*cs;
  const x=c.getContext("2d");
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    x.fillStyle=PAL[g[r][k]]||"#ff00ff";
    x.fillRect(k*cs,r*cs,cs,cs);
  }
  if(state.grid && cs>=8){
    x.strokeStyle="rgba(255,255,255,.12)"; x.lineWidth=1;
    for(let r=0;r<=rows;r++){x.beginPath();x.moveTo(0,r*cs+.5);x.lineTo(cols*cs,r*cs+.5);x.stroke();}
    for(let k=0;k<=cols;k++){x.beginPath();x.moveTo(k*cs+.5,0);x.lineTo(k*cs+.5,rows*cs);x.stroke();}
  }
  return c;
}
function cellBlock(g,label){
  const d=document.createElement("div"); d.className="cell";
  d.appendChild(drawGrid(g));
  const dim=document.createElement("div"); dim.className="dim"; dim.textContent=`${g.length}×${g[0].length}`;
  d.appendChild(dim);
  return d;
}
function pairBlock(pair,label,hideOut){
  const wrap=document.createElement("div"); wrap.className="pair";
  const l=document.createElement("div"); l.className="lbl"; l.textContent=label; wrap.appendChild(l);
  const io=document.createElement("div"); io.className="io";
  io.appendChild(cellBlock(pair.input));
  const a=document.createElement("div"); a.className="arrow"; a.textContent="→"; io.appendChild(a);
  if(pair.output){
    if(hideOut){ const h=document.createElement("div"); h.className="hidden-out"; h.style.minHeight="40px"; h.textContent="hidden"; io.appendChild(h); }
    else io.appendChild(cellBlock(pair.output));
  } else { const h=document.createElement("div"); h.className="hidden-out"; h.textContent="no output"; io.appendChild(h); }
  wrap.appendChild(io);
  return wrap;
}

function renderView(){
  const v=document.getElementById("view"); v.innerHTML="";
  if(!state.id) return;
  const t=D[state.split][state.id];
  const idx=ids().indexOf(state.id);
  const head=document.createElement("div"); head.className="taskhead";
  head.innerHTML=`<span class="id">${state.id}</span>
    <span class="meta">${state.split} &middot; #${idx+1} / ${ids().length} &middot; ${t.train.length} train pair${t.train.length>1?"s":""} &middot; ${t.test.length} test</span>`;
  v.appendChild(head);

  const gt1=document.createElement("div"); gt1.className="group-title"; gt1.textContent="Demonstration pairs"; v.appendChild(gt1);
  const p1=document.createElement("div"); p1.className="pairs";
  t.train.forEach((pr,i)=>p1.appendChild(pairBlock(pr,`train ${i+1}`,false)));
  v.appendChild(p1);

  const gt2=document.createElement("div"); gt2.className="group-title"; gt2.textContent="Test"; v.appendChild(gt2);
  const p2=document.createElement("div"); p2.className="pairs";
  t.test.forEach((pr,i)=>p2.appendChild(pairBlock(pr,`test ${i+1}`,!state.showout)));
  v.appendChild(p2);
}

function renderList(){
  const list=document.getElementById("list"); list.innerHTML="";
  const all=ids();
  const f=state.filter.trim().toLowerCase();
  const shown=f?all.filter(id=>id.includes(f)):all;
  document.getElementById("count").textContent=`${shown.length} / ${all.length} tasks`;
  shown.forEach(id=>{
    const r=document.createElement("div"); r.className="row"+(id===state.id?" on":"");
    r.innerHTML=`<span>${id}</span><span class="ix">${all.indexOf(id)+1}</span>`;
    r.onclick=()=>{ state.id=id; renderList(); renderView(); };
    list.appendChild(r);
  });
}
function select(id){ state.id=id; renderList(); renderView();
  const on=document.querySelector(".list .row.on"); if(on) on.scrollIntoView({block:"nearest"}); }
function step(d){ const a=ids(); let i=a.indexOf(state.id); i=(i+d+a.length)%a.length; select(a[i]); }

// palette legend
(function(){const p=document.getElementById("palette");p.innerHTML="colors&nbsp;";PAL.forEach((c,i)=>{const s=document.createElement("span");s.className="sw";s.style.background=c;s.title=i;p.appendChild(s);});})();

document.querySelectorAll("#split button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#split button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.split=b.dataset.s; state.filter=""; document.getElementById("filter").value="";
  select(ids()[0]);
});
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("rand").onclick=()=>{const a=ids();select(a[Math.floor(Math.random()*a.length)]);};
document.getElementById("cs").oninput=e=>{state.cs=+e.target.value;renderView();};
document.getElementById("grid").onchange=e=>{state.grid=e.target.checked;renderView();};
document.getElementById("showout").onchange=e=>{state.showout=e.target.checked;renderView();};
document.getElementById("filter").oninput=e=>{state.filter=e.target.value;renderList();};
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();step(-1);}
  else if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();step(1);}
  else if(e.key.toLowerCase()==="r")document.getElementById("rand").click();
});

select(ids()[0]);
</script>
</body>
</html>
