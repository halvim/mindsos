# MindsOS Phase 00 — Compose stack.
#
# Services
#   falkordb     — long-running graph database (brought up by `docker compose up -d`).
#   mindsos      — on-demand CLI (profile=cli; invoked via `docker compose run --rm mindsos ...`).
#   mindsos-test — on-demand pytest runner (profile=test; invoked via `docker compose run --rm mindsos-test ...`).
#
# Profiles keep `compose up -d` minimal — only falkordb starts. The CLI and test
# images are built lazily on first `compose run` for that service.
#
# Volumes (host paths relative to repo root)
#   ./.mindsos/falkordb-data → FalkorDB persistence (RDB / AOF).
#   ./.mindsos/logs          → mindsos CLI logs.

services:

  falkordb:
    image: falkordb/falkordb@sha256:30c530c193ac48cb6ea8c6cae745f793d2c098a0a138f7b3e46c1d90848845ba
    container_name: mindsos-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.mindsos/falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mindsos:
    build:
      context: .
      target: prod
      args:
        MINDSOS_GIT_SHA: ${MINDSOS_GIT_SHA:-unknown}
        MINDSOS_IMAGE_HASH: ${MINDSOS_IMAGE_HASH:-unknown}
    image: mindsos:phase07-prod
    profiles: ["cli"]
    # Phase 02 — entrypoint forces the `mindsos` binary so
    # `docker compose run --rm mindsos <subcommand>` works without the
    # doubled `mindsos`. The wrapper still goes through entrypoint.sh, which
    # does the gosu privilege drop + bind-mount chown. To get a shell inside
    # the prod image, override at the compose-run boundary:
    #   docker compose run --rm --entrypoint /bin/bash mindsos
    entrypoint: ["/usr/local/bin/entrypoint.sh", "mindsos"]
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # Phase 07 P86 B — only FALKORDB_PASSWORD added. FalkorDB-Redis auth
      # has no username concept; FALKORDB_GRAPH is a per-call parameter,
      # not a connection-time env. Default empty so unconfigured deploys
      # connect without auth.
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:-}"
    volumes:
      - ./.mindsos/logs:/var/log/mindsos

  mindsos-test:
    build:
      context: .
      target: test
      args:
        MINDSOS_GIT_SHA: ${MINDSOS_GIT_SHA:-unknown}
        MINDSOS_IMAGE_HASH: ${MINDSOS_IMAGE_HASH:-unknown}
    image: mindsos:phase07-test
    profiles: ["test"]
    # The test service keeps the bare entrypoint so `pytest tests/` works
    # without a `mindsos` prefix.
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:-}"
    volumes:
      - ./.mindsos/logs:/var/log/mindsos
