[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase50"
description = "MindsOS command-line interface — Phase 28: Second L3 ship — CapacityLayer registry + dual-metagraph bootstrap + Local-wins lookup + CAN_WRITE_GLOBAL capability gate. Adds 6 new source files to existing mindsos_capacity/ pkg: bootstrap.py (create_global+create_local+ensure_*_graph; ADR-0061+0064+0065), capabilities.py (CAN_WRITE_GLOBAL UPPERCASE per ADR-0078 §am1), capacity_layer.py (CapacityLayer slim — register_datastate/register_capacity/add_constraint/_resolve_declaration Local-wins/_enforce_global_write per ADR-0080 carve-out; drops invoke/resident/rediscover to Phase 30, drops successors/producers/consumers to Phase 29), types.py (SessionProtocol slim copy per ADR-0040 §am2; no deprecation shim), schemas.py (full port — build_datastates_schema + build_category_schema + schema_for_role), views.py (slim — accessors only, drops SuccessorHop to Phase 29). Adds ConstraintViolationError (4th exception class). Closes B-26b-T5 via ADR-0118 §am5: Cypher templates in mindsos_server/release.py + mindsos_admin/promotion.py now MERGE :IN_GRAPH so released Nodes are graph-traversal-reachable. Closes PHASE_MAP §28 + Phase 15b PB-23 alignment-lookup carry-forward (RETRIEVAL capacity, not 13th category). 15 test files / ~107 cases incl. parametrized RESERVED_PROPERTY_KEYS coverage + 9-ADR amendment sentinels + import-isolation (no L3→server, no L3→knowledge) + InvocationResult/call_capacity un-export sentinel. 6 design rounds (R0-R5; R5 = pre-impl probe). See confirmation_docs/PHASE_28_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
# Phase 27 — added "mindsos_capacity*" per same checklist (now 9-site
# at Phase 27 with the manifest [mindsos] packages generalization
# closing the 6-pkg literal-decay class). First L3 (Intellectual
# Capacity) package per PHASE_MAP §27 + ADRs 0062/0063/0066/0067.
# Phase 46 — added "mindsos_intelligence*" per same checklist. First L4
# (Intelligence) package per PHASE_MAP §46 + ADRs 0163-0170.
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*", "mindsos_capacity*", "mindsos_intelligence*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
