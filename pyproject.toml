[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase07"
description = "MindsOS command-line interface — Phase 07 L1 Persistence (Client Protocol + FalkorClient + InMemoryClient + AsyncClient + bootstrap with 14 indexes + GraphRepository + MetagraphRepository (4-step lifecycle) + WAL with context-manager API + 5-bucket integrity scanner + graph-scoped partial scanner + single-Graph load_graph + InstanceRepository sibling-package + `mindsos persistence` 5-verb CLI subapp)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
