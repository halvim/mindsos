[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase13"
description = "MindsOS command-line interface — Phase 13 L2 Schemas (9 role-graph schema builders under mindsos_knowledge/schemas/: 4 seed v3 ports + 5 NET-NEW upper-layer at strict=False per ADR-0149; ontology HyperEdgeType lift per PB-4; schema_for_role dispatch with alignment-prefix branch; UnknownRoleError; mindsos knowledge schema {show, validate} CLI verbs; ADR-0017 §amendment-1 + ADR-0149 Accepted + ADR-0150 Reserved-for-Phase-14a; PHASE_MAP §1 design-only-phases exception clause + §14a row insertion)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
