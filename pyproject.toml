[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase17"
description = "MindsOS command-line interface — Phase 17 RETIRED 2026-05-20: version-dispatch model locked to IRI-string-only per ADR-0150 §amendment-3; MetagraphView.versions_in_role IRI-scan enumerator + mindsos knowledge versions CLI verb shipped (Phase 14 PB-13 partial closure); step(version=) carry-forward vacated (Phase 14 PB-15 closure); active-version verb dropped as vacuous."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
