[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase20"
description = "MindsOS command-line interface — Phase 20: Server: admin reset (narrowed twice). Extends Phase 18's mindsos_server/ in-place with NEW mindsos_server/admin.py module (PB-Z) shipping the reset_admin lock-out recovery verb per ADR-0012 §am2. Scope narrowed at Phase 18 PB-27 (bootstrap lifted to P18) AND Phase 20 PB-B (_assert_not_sole_admin helper + LastAdminError deferred to P22 — no P20 consumer). Reset-admin requires existing admin target (UserNotFoundError per PB-A + PB-O; NotAnAdminError per PB-E + PB-N — strict admin-only, no silent promotion); rotates password + re-enables + kills sessions in single tx DELETE-then-UPDATE order per PB-R; emits 1× EVT_RESET_ADMIN + N× EVT_KILL_SESSION + conditional 1× EVT_ADMIN_ENABLE_USER per PB-D + PB-U (first-fires of EVT_KILL_SESSION + EVT_ADMIN_ENABLE_USER shift P22→P20); CLI mindsos server reset-admin <user_id> positional REQUIRED no-prompt-fallback per PB-G. 13 picks across 4 design rounds; 1 ADR §am2 (0012 batches 6 changes); see confirmation_docs/PHASE_20_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
