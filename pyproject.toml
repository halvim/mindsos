[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase26a"
description = "MindsOS command-line interface — Phase 26a: FalkorDB persistence wiring (Integration A substrate). Wires importer + propose + release + audit_gate to FalkorDB via per-CLI fresh `FalkorClient` per Phase 07 P4 A. Adds `mindsos_server/persistence/bootstrap.py::bootstrap_kl_from_falkordb` load-or-mint seam (`MetagraphLoader.find_by_name` + `MetagraphRepository.persist` MERGE-idempotent). Adds 19th `DEFAULT_INDEXES` entry `(node, Metagraph, name)` per ADR-0123 §am1 for hot-path lookup. Adds positional `client: Client` parameter to `propose_for_promotion`, `release_update`, `audit_gate.run`; in-memory shape preserved; Cypher writes use metagraph_id+graph_id+node_id MERGE keys (ADR-0118 §am3 — supersedes §am2 per-FalkorDB-graph-per-role naming). Closes Phase 14a round-3 lock + ADR-0118 §am2 Phase-26 commitments. ADR delta: ADR-0118 §am3 (NEW), ADR-0010 §am2 (admin → core ALLOWED), ADR-0123 §am1 (Metagraph.name index). 8 design rounds (R0-R7) re-litigation cascade. See confirmation_docs/PHASE_26a_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
