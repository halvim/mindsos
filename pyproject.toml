[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase05b"
description = "MindsOS command-line interface — Phase 05b L1 IntergraphEdge (binary) + IntergraphEdgeType + MetagraphSchema container (ADR-0148 first draft; new `mindsos metagraph-schema` subapp + 5 new metagraph subcommands + 4-way set-prop mutex + metagraph state-file v=1→v=2 + new metagraph-schema-<n>.json v=1)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
