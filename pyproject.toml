[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase06"
description = "MindsOS command-line interface — Phase 06 L1 Instancing (mindsos_instances sibling package; 8 element-instance subclasses + ElementRegistry + materialise machinery + cascade-observer; round-7 P45-P66 reshape including ADR file edits deferred to Phase 38, ID derivation drops overrides-hash, bifurcated override validation, endpoint-resolution walk in materialise)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
