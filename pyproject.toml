[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase12"
description = "MindsOS command-line interface — Phase 12 L2 Identifiers + role IRIs + REF_TYPES (new mindsos_knowledge package: 14 IRI builders per ADR-0045 + alignment_role graph-name helper + table-driven parse_iri + is_version_qualified_iri + REF_TYPES open vocabulary per ADR-0047 + ref-key helpers + 8 role constants + 3 frozensets; mindsos knowledge {iri build|parse|validate, ref-types --list, roles --list} CLI; doctor 4-pkg version-string parity)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
