[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase16"
description = "MindsOS command-line interface — Phase 16 L2 admin similarity surface (NEW mindsos_admin/similarity.py + _content_hash.py + exceptions.py; ADR-0144 §Heuristic Accepted per §amendment-1; three weighted scorers Levenshtein on IRI tail + structural Jaccard on per-role (frame_elements, synonyms, parents) extractors + reference Jaccard on ref:<role> ∪ XRef; thresholds 0.85 blocking / 0.5 review; role-scoped content-hash report_id per ADR-0052 §amendment-1; EmptyComparisonError contract per ADR-0144 §amendment-2; mindsos admin promote {list, similarity} CLI verbs; mutating propose entry-point deferred to Phase 24 per PB-1c reframe)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
