[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase09"
description = "MindsOS command-line interface — Phase 09 L1 XRef (cross-metagraph refs: first-class XRef primitive + Metagraph.add_xref/iter_xrefs/remove_xref + WAL-wrapped XRefRepository + per-Client replayer registration + XRefLoader after-load observer + xref-list CLI + migration callable + state-file v=4)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
