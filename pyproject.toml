[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase22"
description = "MindsOS command-line interface — Phase 22: Server: admin ops. Extends Phase 18's mindsos_server/ in-place — extends admin.py with six new verbs (admin_promote_user, admin_demote_user, admin_disable_user, admin_enable_user, admin_kill_session, hard_delete_user) + six result dataclasses + admin_tx BEGIN IMMEDIATE wrapper (R4 PB-24 closing WAL concurrent-admin race) + _assert_not_sole_admin helper (R1 PB-7 closing the PB-B deferral from Phase 20). errors.py adds LastAdminError + AlreadyAnAdminError + SessionNotFoundError; NotAnAdminError message reworked verb-agnostic per R4 PB-25. CLI `mindsos server admin <verb>` subgroup (R1 PB-2) houses the six verbs; reset-admin + query-audit stay flat under `mindsos server` per established Phase 20/21 precedent. Cross-user read (ADR-0008) DEFERRED to Phase 25 alongside MindsOSServer + LocalPersister per R1 PB-1 + ADR-0008 §am1. 27 picks across 5 design rounds; ADR-0012 §am3 (closes PB-B deferral) + ADR-0008 §am1 (cross-user shift P22→P25); see confirmation_docs/PHASE_22_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
