[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase19"
description = "MindsOS command-line interface — Phase 19: Server: sessions. Extends Phase 18's mindsos_server/ in-place; schema v2 adds sessions table (5 columns per PB-10; expires_at computed at lookup); free-function login/logout/session_from_token/kill_my_own_sessions surface per PB-13 (MindsOSServer class deferred to Phase 25 per ADR-0011 §am1); SessionTTL injection per PB-15; unified InvalidSessionError per PB-14; 2-field AlreadyLoggedInError per PB-3; CLI verbs mindsos server {login,whoami,logout} with hybrid file+env token storage per PB-5; users.verify() refactored to pure predicate per PB-9 (callers own audit). 15 picks across 3 design rounds; 5 ADR §am1 amendments (0003/0004/0005/0011/0013); see confirmation_docs/PHASE_19_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
