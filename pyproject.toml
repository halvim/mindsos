[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase21"
description = "MindsOS command-line interface — Phase 21: Server: audit log reader. Extends Phase 18's mindsos_server/ in-place with NEW mindsos_server/authz.py module (PB-6) shipping _require_or_audit + PermissionDeniedError + admin_query_audit (in admin.py per PB-Z) + AuditRow per ADR-0013 §am2. Reader signature locked (PB-1 + PB-8 + PB-10): admin_query_audit(conn, session, *, actor=None, event=None, target=None, since=None, until=None, after_id=None, limit=100, count_only=False) -> list[AuditRow] | int. CLI mindsos server query-audit flat verb gated on CAN_VIEW_AUDIT_LOG (ADMIN_CAPS only per ADR-0002 §am1). Lenient ISO-8601 parsing (PB-22) + inclusive bounds (PB-11) + ASC default order with after_id cursor (PB-12 + PB-20). --count-only flag (PB-4) reframes 'audit stats'. EVT_AUDIT_QUERY new constant (PB-16) honors ADR-0013 §Decision's happy-path-audit-required clause; emitted per call with sparse filters snapshot + count + count_only flag (PB-17); included in default reader output (PB-16i). Schema v2→v3 with idx_audit_target migration (PB-7 + PB-19). 20 picks across 4 design rounds; 1 ADR §am2 (0013 batches 9 changes); see confirmation_docs/PHASE_21_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
