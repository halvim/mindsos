[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase14"
description = "MindsOS command-line interface — Phase 14 L2 KnowledgeLayer + role-graph bootstrap (KnowledgeLayer class with Global constructor + bootstrap classmethod per ADR-0042 §amendment-1; ensure_global_role_graph + ensure_local_role_graph module helpers with ADR-0044 scope enforcement; alignment Global-only at v1 per ADR-0150 §amendment-1; MetagraphView whitelist read-only wrapper; install_local_metagraph / extract_local_metagraph hooks per ADR-0042; lazy local_metagraph auto-ensure; no write API per ADR-0138 Proposed; no validators surface per ADR-0139 Proposed; carry-forwards alignment-anchor IRI + MetagraphSchema scanner deferred to Phase 15)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
