[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase24"
description = "MindsOS command-line interface — Phase 24: Server + admin: per-user transactional promotion + release-boundary atomicity (ATOM admin-direct only). Lands ADR-0118 pivot model in code — admin-direct ATOM propose_for_promotion (mindsos_admin/promotion.py) + release_update (mindsos_server/release.py) + two-pass audit gate (mindsos_admin/audit_gate.py) + RELEASE_SHIP_LOCK (mindsos_server/locks.py) + schema v3→v4 with pending_mutations + releases tables + 2 new caps (CAN_PROPOSE_MUTATION + CAN_APPROVE_RELEASE) + 4 EVT_* (EVT_PROMOTION_PROPOSED + EVT_PROMOTION_REJECTED + EVT_RELEASE_SHIPPED + EVT_RELEASE_FAILED) + CLI `mindsos server release {propose-for-promotion,ship}` subgroup. Rerun-recovery semantics per Round 0 PB-Z1..Z22 (MERGE-on-id Cypher template + suppression-set watermark + FAILED-row forensic node-id list + node-id-scoped DELETE template + ADR-0010 §am1 DAG enumeration). SQLite + in-memory Metagraph only per Z21(b); FalkorDB Cypher templates deferred to Phase 26 wiring phase. Source-user-Local propose path + lazy migration deferred to Phase 25 per ADR-0008 §am1 + ADR-0118 §am1. STRUCTURE/SUBGRAPH/PIPELINE kinds raise NotImplementedError. 44 picks across 6 design rounds (28 original + 16 Round 0); ADR delta 13 touches (3 new drafts 0114/0115/0120 + 4 Status flips + 3 indirect Supersessions + 5 §amendments); see confirmation_docs/PHASE_24_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
