[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase10"
description = "MindsOS command-line interface — Phase 10 L1 Snapshot + soft-delete substrate + RemovalImpact + XRef setters (MetagraphSnapshot.of/restore_into per ADR-0027/0028/0129 + 20 setter methods on Graph/Metagraph quartet + 4 XRef quartet PX2 + RemovalImpact dataclass with raise-on-block contract + iterator/loader filter pass + state-file v=5 + 10 WAL replayer kinds + xref-list 10-field surface)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
