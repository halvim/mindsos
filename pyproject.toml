[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase25"
description = "MindsOS command-line interface — Phase 25: Server cross-user-read substrate (read_other_local + LocalPersister Protocol + SessionProtocol in KL). Lands ADR-0008 first consumer — `mindsos_server.orchestrator.read_other_local` ctx mgr with refcount-install + transient + never-flush-on-teardown (I-S3). Ships ADR-0011 §am2 LocalPersister Protocol + InMemoryLocalPersister (SQLite + Falkor defer); ADR-0040 first ship of `mindsos_knowledge.types.SessionProtocol`; ADR-0006 §am2 UserMutexRegistry first consumer; ADR-0114 §am4 Phase 24 latent FK gap closure (UserHasPromotionHistoryError pre-check inside hard_delete_user); ADR-0013 §am EVT_HARD_DELETE_USER.extra `local_dump_existed` key (PB-39). New CLI verb `mindsos server admin read-local` (summary-only output per PB-26). Module-level orchestrator state per PB-38 (MindsOSServer class defers to first user-Local-write phase). Per-call persister + kl kwargs per PB-40 (no init_orchestrator global). Cap-check pre-runs at outer summary entry per PB-R6-05 (info-leak fix). 47 PB candidates across 5 design rounds + Round 6 + Round 7 re-litigation cascades; ADR delta 6 touches (1 Status flip + 4 §amendments + 1 first ship); 0 schema bumps; +1 exit code (10 for UserHasPromotionHistoryError). See confirmation_docs/PHASE_25_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
