[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase26b"
description = "MindsOS command-line interface — Phase 26b: Integration A end-to-end scripted scenario + B-26a-T4 closure. Adds `bootstrap_global_pair_from_falkordb(client) -> (KnowledgeLayer, Metagraph)` symmetric load-or-mint pair helper at `mindsos_server/persistence/bootstrap.py` (canonical + pending Global anchors persist on first-ever bootstrap for stable metagraph_id across CLI invocations). Rewires `_build_global_metagraphs(conn) → _build_global_metagraphs(conn, client)` to call the pair helper (canonical FalkorDB-loaded) + `rehydrate_pending_global(conn, pending_mg)` (pending SQLite-rehydrated per Z21.1). Propose + ship CLI verb callsites reorder `client = _resolve_client()` open BEFORE pair helper. Closes B-26a-T4 ephemeral-metagraph_id gap from Phase 26a host smoke. ADR delta: ADR-0118 §am4 (NEW — two-store decomposition; canonical content authority = FalkorDB; pending content authority = SQLite; ship manifest authority = SQLite). 6 design rounds (R0-R6) + R5 pre-impl probe. See confirmation_docs/PHASE_26b_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
