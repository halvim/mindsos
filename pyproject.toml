[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase08"
description = "MindsOS command-line interface — Phase 08 L1 Reconstruction (metagraph loader + streaming iter_load_graph + refresh + 3 new exception classes + after-load observer + first L1 WAL consumer (recover-on-load) + sibling InstanceLoader + `mindsos persistence sync/load --metagraph M` + `verify --source=db --metagraph M` unblock + `--graph G | --metagraph M` mutex)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
