[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-cli"
version = "0.0.0+phase27"
description = "MindsOS command-line interface — Phase 27: First L3 ship — DataStates + capacity primitives slim port. Adds NEW top-level `mindsos_capacity/` package (7th) with 5 source files: ShapeDescriptor + DataState (purely structural per ADR-0063), Capacity / Monitor / Adapter dataclasses with stable IRI `capacity:<category>:<name>` (ADR-0066) + `_CapacityBase.validate_for_registration`, REF_TYPES (6-member subset of L2 per ADR-0067 §amendment-1 with PROMOTED carve-out), 12 functional categories + node/edge/constraint/ref vocabularies + 3 exceptions (base + DataStateError + CapacityRegistrationError). EXCLUDED (defer): types.py (Phase 33), capacity_layer.py (Phase 28), bootstrap.py (Phase 28), discovery.py (Phase 29), runtime.py (Phase 30), schemas.py (Phase 28+), views.py (Phase 28+), capabilities.py (Phase 28), builtins/ (Phase 31). InvocationResult + call_capacity live in capacity.py but NOT exported from __init__.py until Phase 30. Manifest [mindsos] packages list generalization closes the 6-pkg literal-decay class: doctor.py + tests/phase_18/test_doctor_6pkg_parity.py iterate the manifest list. New `docs/usage/capacity/data-states.md` mkdocs nav entry. 5 design rounds (R0-R5; R4 saturation) + parent ADR edits (0066 §Implementation footer + 0067 §amendment-1). See confirmation_docs/PHASE_27_DESIGN_LOG.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henrique Alvim", email = "sanmyaku.entertainment@gmail.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer",
    "falkordb",
    # Phase 15a — admin importers parse external knowledge sources:
    # * rdflib parses DOLCE OWL (RDF/XML, Turtle).
    # * lxml accelerates OEWN-LMF + FrameNet XML; stdlib xml.etree
    #   fallback is supported but slow on real (~30 MB) OEWN.
    "rdflib",
    "lxml",
    # Phase 18 — argon2id password hashing per ADR-0003 + Phase 18
    # PB-14 / PB-22 / PB-31. mindsos_server/_argon2.py wraps
    # argon2.PasswordHasher with explicit Argon2Params injection
    # (PRODUCTION_PARAMS for production; _TEST_FAST_PARAMS for tests).
    "argon2-cffi",
]

[project.scripts]
mindsos = "mindsos_cli.__main__:main"

[tool.setuptools.packages.find]
# Phase 15a — added "mindsos_admin*" per the 7-site new-top-level-
# package checklist (`feedback_new_top_level_package.md`). Admin
# permanent home per ADR-0140 §amendment-1; supersedes ADR-0140
# §Decision §1+§2 relocation-to-server.
# Phase 18 — added "mindsos_server*" per same 7-site checklist. First
# L0 (Server Layer) package per ADR-0001 + Phase 18 PB-1 (row Net-new
# amendment) + PB-25 (server depends on mindsos_knowledge for the
# _USER_ID_RE regex import; ADR-0010 permits the server→KL direction).
# Phase 27 — added "mindsos_capacity*" per same checklist (now 9-site
# at Phase 27 with the manifest [mindsos] packages generalization
# closing the 6-pkg literal-decay class). First L3 (Intellectual
# Capacity) package per PHASE_MAP §27 + ADRs 0062/0063/0066/0067.
include = ["mindsos_cli*", "mindsos_core*", "mindsos_instances*", "mindsos_knowledge*", "mindsos_admin*", "mindsos_server*", "mindsos_capacity*"]

[tool.setuptools.package-data]
mindsos_cli = ["manifest.toml"]
