[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsos-arc"
version = "0.1.0"
description = "ARC intelligence packaged as an on-top MindsOS skill bundle (installs via the Phase-50 skill path; consumes released mindsos)."
requires-python = ">=3.10"
# Consumes MindsOS; installed ON TOP (not part of the mindsos wheel).
# Base distribution is `mindsos-runtime` (renamed from `mindsos-cli` 2026-07-06;
# ships all 8 mindsos_* packages). Installs run --no-deps (two-step; see
# confirmation_docs/SKILL_REPO_CONTRACT.md in base), so this line is a
# correctness declaration, not pip-resolved today.
dependencies = ["mindsos-runtime"]

[tool.setuptools.packages.find]
include = ["mindsos_arc*"]

[tool.setuptools.package-data]
# Ship the bundle manifest inside the wheel so `mindsos skill install -m <path>`
# can resolve it with no bind-mount (the mindsos_cli manifest precedent).
mindsos_arc = ["bundle/manifest.toml"]
